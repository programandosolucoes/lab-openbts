<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgBR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="boxSP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="boxRJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="12" fill="url(#bgBR)" stroke="#1e293b" stroke-width="2"/>

  <!-- Título -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">TOPOLOGIA REGIONAL BRASIL: SÃO PAULO (11) ↔ RIO DE JANEIRO (21)</text>
    <text x="0" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Roteamento Least Cost Routing (LCR) • Túnel SIP Cifrado Privado • Convergência Celular MVNO e PABX Nuvem</text>
  </g>

  <!-- POP SÃO PAULO (DDD 11) -->
  <g transform="translate(50, 90)">
    <rect width="420" height="460" rx="10" fill="#131e38" stroke="#3b82f6" stroke-width="2"/>
    <rect width="420" height="38" rx="10" fill="url(#boxSP)"/>
    <text x="20" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">POP SÃO PAULO • DDD 11 (Matriz Corporativa)</text>

    <!-- Subcomponentes SP -->
    <!-- SBC / Roteador -->
    <rect x="25" y="55" width="370" height="85" rx="6" fill="#1e293b" stroke="#60a5fa"/>
    <text x="40" y="78" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Yate Core SBC / Router SP (IP: 10.11.0.1)</text>
    <text x="40" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roteamento: regexroute.conf • Interceptação Node.js</text>
    <text x="40" y="118" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Tratamento E.164: +55 11 XXXX-XXXX (Local) / LCR Out</text>

    <!-- Asterisk PABX SP -->
    <rect x="25" y="155" width="370" height="85" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="40" y="178" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Asterisk PABX SP (IP: 10.11.0.10:5060)</text>
    <text x="40" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Serviços: URA 1000, Eco 8001, Conferência 8000</text>
    <text x="40" y="218" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Tronco PJSIP inter-cidades com TLS/SRTP</text>

    <!-- Core 5G Open5GS SP -->
    <rect x="25" y="255" width="370" height="85" rx="6" fill="#1e293b" stroke="#2563eb"/>
    <text x="40" y="278" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Open5GS Core SP (AMF / UPF / WebUI)</text>
    <text x="40" y="298" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">MNC 01 (Brasil Test) • APN: corporativo.mvno</text>
    <text x="40" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">VoLTE / IMS Proxy integrado ao PABX</text>

    <!-- Ramais e Clientes SP -->
    <rect x="25" y="355" width="370" height="85" rx="6" fill="#0f172a" stroke="#1d4ed8"/>
    <text x="40" y="378" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RAMAIS E DISPOSITIVOS SP:</text>
    <text x="40" y="400" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📞 Ramal 1101 (MicroSIP Diretoria)</text>
    <text x="40" y="420" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📱 Ramal 1102 (Chip Celular 4G/5G MVNO)</text>
  </g>

  <!-- POP RIO DE JANEIRO (DDD 21) -->
  <g transform="translate(530, 90)">
    <rect width="420" height="460" rx="10" fill="#0e231f" stroke="#10b981" stroke-width="2"/>
    <rect width="420" height="38" rx="10" fill="url(#boxRJ)"/>
    <text x="20" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">POP RIO DE JANEIRO • DDD 21 (Filial Operações)</text>

    <!-- Subcomponentes RJ -->
    <!-- SBC / Roteador RJ -->
    <rect x="25" y="55" width="370" height="85" rx="6" fill="#1e293b" stroke="#34d399"/>
    <text x="40" y="78" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Yate Core SBC / Router RJ (IP: 10.21.0.1)</text>
    <text x="40" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roteamento: regexroute.conf • Queues Locais</text>
    <text x="40" y="118" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Tratamento E.164: +55 21 XXXX-XXXX (Local) / LCR In</text>

    <!-- Asterisk PABX RJ -->
    <rect x="25" y="155" width="370" height="85" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="40" y="178" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Asterisk PABX RJ (IP: 10.21.0.10:5060)</text>
    <text x="40" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Filas de Atendimento e Gravação de Áudio</text>
    <text x="40" y="218" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Failover e redundância de rotas</text>

    <!-- Core 5G / UPF RJ -->
    <rect x="25" y="255" width="370" height="85" rx="6" fill="#1e293b" stroke="#059669"/>
    <text x="40" y="278" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Edge UPF e gNodeB RJ (UERANSIM)</text>
    <text x="40" y="298" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Plano de Usuário Distribuído de Baixa Latência</text>
    <text x="40" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">SCTP 38412 ligado ao Core Central</text>

    <!-- Ramais e Clientes RJ -->
    <rect x="25" y="355" width="370" height="85" rx="6" fill="#0f172a" stroke="#047857"/>
    <text x="40" y="378" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RAMAIS E DISPOSITIVOS RJ:</text>
    <text x="40" y="400" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📞 Ramal 2101 (MicroSIP Engenharia RJ)</text>
    <text x="40" y="420" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📱 Ramal 2102 (Chip Celular 4G/5G Técnico)</text>
  </g>

  <!-- Conexão Tronco Inter-Cidades (SP ↔ RJ) -->
  <g transform="translate(470, 230)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4,4"/>
    <polygon points="5, -6 0, 0 5, 6" fill="#f59e0b"/>
    <polygon points="55, -6 60, 0 55, 6" fill="#f59e0b"/>
    <rect x="-35" y="-35" width="130" height="26" rx="4" fill="#78350f" stroke="#f59e0b"/>
    <text x="-25" y="-18" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TÚNEL SIP / LCR</text>
    <text x="-35" y="22" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9">Custo Zero (VoIP)</text>
  </g>

  <!-- Rodapé Regulatório -->
  <g transform="translate(40, 570)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Padrão de Numeração Anatel: Formato E.164 (+55 11 / +55 21) • Interconexão Privada sem Cobrança de Degrau Tarifário Nacional</text>
  </g>
</svg>
