    <text x="40" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Bridge de Conferência Executiva Transatlântica</text>
    <text x="40" y="218" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Jitter Buffer adaptativo para links submarinos</text>

    <!-- Edge Gateway NY -->
