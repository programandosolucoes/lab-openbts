  <!-- Conexão Tronco Inter-Cidades EUA (Miami ↔ NY) -->
  <g transform="translate(470, 230)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#c084fc" stroke-width="4" stroke-dasharray="4,4"/>
    <polygon points="5, -6 0, 0 5, 6" fill="#c084fc"/>
    <polygon points="55, -6 60, 0 55, 6" fill="#c084fc"/>
