    <text x="-25" y="-18" fill="#f3e8ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TLS/SRTP TRUNK</text>
    <text x="-30" y="22" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="9">Latência: ~30 ms</text>
  </g>

  <!-- Rodapé Regulatório -->
  <g transform="translate(40, 570)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Conformidade FCC Part 68 • Roteamento Direto sem Passing Fee de Operadoras Convencionais • Cifrado Ponta a Ponta</text>
