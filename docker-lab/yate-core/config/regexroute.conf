[default]
; --- Ramais internos (São Paulo, Rio, Miami, NY, Lisboa, Porto): 4 dígitos ---
^[1-3][0-9]{3}$=lateroute/${called}

; --- Sala de conferência internacional (bancada) ---
^8000$=conf/sala-internacional

; --- Teste de Eco (Verificação de áudio bidirecional e latência RTP) ---
^8001$=echo

; --- Teste de Tom / Verificação de sinalização ---
^8002$=tone/dial

; --- Chamadas com prefixos internacionais (E.164) encaminhadas ao Node.js ExtModule ---
^\+?[0-9]+$=extmodule/yate_controller.js

; --- Negação explícita como defesa contra fraude de tarifação ---
.*=-;error=noroute
