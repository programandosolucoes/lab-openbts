; Configuração do extmodule para conexão com Node.js (ou Python)

[general]
; Prioridade do módulo
priority=100

[scripts]
; Aqui você pode iniciar scripts gerenciados diretamente pelo Yate, se desejar
; node_controller.sh=node /app/yate_controller.js

[listener]
; Habilita porta de socket TCP para controladores externos (Node.js) se conectarem
type=tcp
addr=0.0.0.0
port=5039
