<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130e"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </linearGradient>
    <linearGradient id="boxLIS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="boxOPO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" rx="12" fill="url(#bgPT)" stroke="#1e293b" stroke-width="2"/>

  <!-- Título -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">TOPOLOGIA REGIONAL PORTUGAL: LISBOA (+351 21) ↔ PORTO (+351 22)</text>
    <text x="0" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Padrão Europeu E.164 • Codec G.711a (PCMA) Obrigatório • Gateway Transatlântico para Brasil e EUA</text>
  </g>

  <!-- POP LISBOA (+351 21) -->
  <g transform="translate(50, 90)">
    <rect width="420" height="460" rx="10" fill="#291414" stroke="#ef4444" stroke-width="2"/>
    <rect width="420" height="38" rx="10" fill="url(#boxLIS)"/>
    <text x="20" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">POP LISBOA • Prefixo +351 21 (Sede Europa)</text>

    <!-- Subcomponentes Lisboa -->
    <!-- SBC Lisboa -->
    <rect x="25" y="55" width="370" height="85" rx="6" fill="#1e293b" stroke="#f87171"/>
    <text x="40" y="78" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Yate Core SBC Lisboa (IP: 10.35.1.1)</text>
    <text x="40" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roteamento E.164: +351 21 XXX XXXX (Local)</text>
    <text x="40" y="118" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Interconexão ANACOM & Trânsito Europeu IP</text>

    <!-- Asterisk Lisboa -->
    <rect x="25" y="155" width="370" height="85" rx="6" fill="#1e293b" stroke="#ef4444"/>
    <text x="40" y="178" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Asterisk PABX Lisboa (IP: 10.35.1.10:5060)</text>
    <text x="40" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Codec Principal: G.711a (A-Law Padrão Europeu)</text>
    <text x="40" y="218" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">URA multilíngue (Português, Inglês e Espanhol)</text>

    <!-- Open5GS Lisboa -->
    <rect x="25" y="255" width="370" height="85" rx="6" fill="#1e293b" stroke="#b91c1c"/>
    <text x="40" y="278" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Open5GS UPF & Euro Core Edge</text>
    <text x="40" y="298" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roaming Europeu (Regulamento Roam Like at Home)</text>
    <text x="40" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">SCTP 38412 para amarração de antenas 5G SA</text>

    <!-- Ramais Lisboa -->
    <rect x="25" y="355" width="370" height="85" rx="6" fill="#0f172a" stroke="#991b1b"/>
    <text x="40" y="378" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RAMAIS E DISPOSITIVOS LISBOA:</text>
    <text x="40" y="400" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📞 Ramal 3511 (MicroSIP Escritório Lisboa)</text>
    <text x="40" y="420" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📱 Ramal 3513 (Chip Celular MVNO Portugal)</text>
  </g>

  <!-- POP PORTO (+351 22) -->
  <g transform="translate(530, 90)">
    <rect width="420" height="460" rx="10" fill="#10261e" stroke="#10b981" stroke-width="2"/>
    <rect width="420" height="38" rx="10" fill="url(#boxOPO)"/>
    <text x="20" y="25" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">POP PORTO • Prefixo +351 22 (Polo Tecnológico Norte)</text>

    <!-- Subcomponentes Porto -->
    <!-- SBC Porto -->
    <rect x="25" y="55" width="370" height="85" rx="6" fill="#1e293b" stroke="#34d399"/>
    <text x="40" y="78" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Yate Core SBC Porto (IP: 10.35.2.1)</text>
    <text x="40" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Roteamento E.164: +351 22 XXX XXXX (Local)</text>
    <text x="40" y="118" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">LCR inteligente entre Norte de Portugal e Espanha</text>

    <!-- Asterisk Porto -->
    <rect x="25" y="155" width="370" height="85" rx="6" fill="#1e293b" stroke="#10b981"/>
    <text x="40" y="178" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Asterisk PABX Porto (IP: 10.35.2.10:5060)</text>
    <text x="40" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Serviço de Fila de Suporte Técnico Devs</text>
    <text x="40" y="218" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">RTP jitter buffer otimizado para fibra ótica</text>

    <!-- Open5GS Porto -->
    <rect x="25" y="255" width="370" height="85" rx="6" fill="#1e293b" stroke="#059669"/>
    <text x="40" y="278" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">UERANSIM 5G SA gNodeB Porto</text>
    <text x="40" y="298" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Emulação de Célula de Alta Densidade</text>
    <text x="40" y="318" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Interconexão via tun0 com rede corporativa</text>

    <!-- Ramais Porto -->
    <rect x="25" y="355" width="370" height="85" rx="6" fill="#0f172a" stroke="#047857"/>
    <text x="40" y="378" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RAMAIS E DISPOSITIVOS PORTO:</text>
    <text x="40" y="400" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📞 Ramal 3512 (MicroSIP Engenharia Porto)</text>
    <text x="40" y="420" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">📱 Ramal 3514 (Chip Celular MVNO Norte)</text>
  </g>

  <!-- Conexão Tronco Inter-Cidades Portugal (Lisboa ↔ Porto) -->
  <g transform="translate(470, 230)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#f87171" stroke-width="4" stroke-dasharray="4,4"/>
    <polygon points="5, -6 0, 0 5, 6" fill="#f87171"/>
    <polygon points="55, -6 60, 0 55, 6" fill="#f87171"/>
    <rect x="-35" y="-35" width="130" height="26" rx="4" fill="#7f1d1d" stroke="#f87171"/>
    <text x="-25" y="-18" fill="#fee2e2" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">FIBRA DEDICADA</text>
    <text x="-30" y="22" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9">Latência: ~4 ms</text>
  </g>

  <!-- Rodapé Regulatório -->
  <g transform="translate(40, 570)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Regulação ANACOM / BEREC • Transcodificação Dinâmica Automática A-Law (G.711a) ↔ Mu-Law (G.711u) pelo Yate</text>
  </g>
</svg>
